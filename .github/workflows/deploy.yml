name: Deploy to AWS
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    - name: Set up AWS CLI
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1
        
    - name: Create S3 bucket if it doesn't exist
      run: |
        # Check if bucket exists, create if it doesn't
        if ! aws s3api head-bucket --bucket image-caption-app-bucket 2>/dev/null; then
          aws s3 mb s3://image-caption-app-bucket --region ap-south-1
        fi
    
    - name: Get available solution stacks
      run: |
        aws elasticbeanstalk list-available-solution-stacks --query "SolutionStacks[?contains(@, 'Python')]" > python_stacks.txt
        cat python_stacks.txt
        
    - name: Deploy Application to Elastic Beanstalk
      run: |
        zip -r app.zip .
        # Upload zip to S3
        aws s3 cp app.zip s3://image-caption-app-bucket/app.zip
        
        # Check if application exists, create if it doesn't
        if ! aws elasticbeanstalk describe-applications --application-names "ImageCaptionApp" 2>/dev/null | grep -q "ImageCaptionApp"; then
          aws elasticbeanstalk create-application --application-name "ImageCaptionApp"
        fi
        
        # Create new application version
        aws elasticbeanstalk create-application-version \
          --application-name "ImageCaptionApp" \
          --version-label "v1-$(date +%s)" \
          --source-bundle S3Bucket=image-caption-app-bucket,S3Key=app.zip
        
        # Get latest Python platform
        LATEST_PYTHON_STACK=$(aws elasticbeanstalk list-available-solution-stacks --query "SolutionStacks[?contains(@, 'Python')]" --output text | head -1)
        echo "Using solution stack: $LATEST_PYTHON_STACK"
        
        # Check if environment exists
        if ! aws elasticbeanstalk describe-environments --environment-names "ImageCaptionEnv" 2>/dev/null | grep -q "ImageCaptionEnv"; then
          # Create environment if it doesn't exist
          aws elasticbeanstalk create-environment \
            --application-name "ImageCaptionApp" \
            --environment-name "ImageCaptionEnv" \
            --solution-stack-name "$LATEST_PYTHON_STACK" \
            --version-label "v1-$(date +%s)"
        else
          # Update environment if it exists
          aws elasticbeanstalk update-environment \
            --application-name "ImageCaptionApp" \
            --environment-name "ImageCaptionEnv" \
            --version-label "v1-$(date +%s)"
        fi
